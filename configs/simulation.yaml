# Offline dry run: synthetic items + simulated backend. No API keys, no network.
seed: 0
top_frac: 0.10   # top 10% of the whole eval set: k = ceil(0.10 * n_eval)
budget: null
budget_matched_k: [2, 3, 4, 5, 6, 8]
linkage_k: [2, 3, 4, 5, 6, 8, 10, 12, 14, 16]
deployment_sc_draws: 3
sprt: {p0: 0.7, p1: 0.95, alpha: 0.1, beta: 0.1, eps0: 0.05, p0_star: 0.8}
split: {n_dev: 100, n_eval: 500, n_cal: 200}
# Score model on D_fit (= dev slice) and certified selection on D_cal (decisions.md #17).
# Pessimistic score s = mu - lambda*sigma, lambda by cv_folds-fold CV on D_fit over `lambdas`.
scoring: {ridge: 1.0, prior: [0.5, 0.5], lambdas: [0, 0.5, 1, 1.5, 2, 3], cv_folds: 5,
          alphas: [0.05, 0.1, 0.2], q0_level: 0.95,
          gray_box: false,   # true: also use the first-token probability (needs collect.logprobs)
          budget_band: 1.0}  # CEL-k: budget k is a target; plan spends in (k - band, k] on dev (decisions.md #26)
# Frontier allocation (decisions.md #18): k1 first draws per case, then LUCB on the top-k cut
# with half-width z*sigma; the score model sees `reps` random partial states per D_fit case.
frontier: {k1: 1, z: 1.0, reps: 8}
# Signal values (SHAP closed form) and the Prop. K knapsack allocation (decisions.md #19).
knapsack: {max_extra: 6, prune_tol: 0.01, n_boot: 200}
# Fitted stability prior for the certified mode: Beta(a, b) on `draws` fresh draws per holdout
# case (no labels), depth = bootstrap `quantile` (decisions.md #19). Jeffreys stays the reference.
prior: {draws: 5, n_boot: 1000, quantile: 0.95}
datasets: [triviaqa, strategyqa, mmlu]
synthetic: true
models:
  - {provider: simulated, model: sim, seed: 1}
generator: {provider: simulated, seed: 1}
judge: {provider: simulated, seed: 1, name: judge}
collect: {n_paraphrases: 12, n_same: 16, n_reuse_paras: 3, n_reuse_samples: 3, temperature: 0.7, verbal_per_draw: true, logprobs: true, workers: 8}
paths: {cache: experiments/results/cache/simulation, results: experiments/results}   # own cache: simulated responses never mix with real ones
