[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confledger"
version = "0.1.0"
description = "CEL (Confidence Evidence Ledger): certified, label-free confidence ranking for black-box LLMs under a limited API budget"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
data = ["datasets>=2.19"]
dev = ["pytest>=7"]
nli = ["torch>=2.1", "transformers>=4.40,<5"]   # local NLI judge (decisions.md #30)
notebook = ["ipykernel>=6", "pandas>=2", "nbformat>=5", "nbclient>=0.10"]


[tool.setuptools.packages.find]
where = ["src", "."]
include = ["confledger*", "data", "data.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
